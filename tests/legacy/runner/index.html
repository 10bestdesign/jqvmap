<!DOCTYPE html>
<html id="html">

<head>
  <meta charset="utf-8">
  <title>JQVMap - Legacy Test Suite (runner)</title>
  <link rel="stylesheet" href="qunit/qunit.css">
  <link rel="stylesheet" href="../../../dist/jqvmap.css">

  <!-- Use the vendored local jQuery to avoid network fetches inside PhantomJS -->
  <script>
    // Early diagnostics for PhantomJS runs: surface errors and mark page load.
    console.log('RUNNER: inline diagnostic script executing');
    window.onerror = function (message, source, lineno, colno, error) {
      console.log('PAGE_ERROR: ' + message + ' at ' + source + ':' + lineno + ':' + colno);
    };
  </script>
  <script type="text/javascript" src="../../../dist/lib/jquery.min.js"></script>
  <script type="text/javascript" src="../../../dist/jquery.vmap.js"></script>
  <script type="text/javascript" src="../../../dist/maps/jquery.vmap.world.js" charset="utf-8"></script>
  <!-- Load local QUnit copy bundled with the runner (we use a single canonical copy inside the runner now) -->
  <script src="qunit/qunit.js"></script>

  <script src="tests.js"></script>
</head>

<body id="body">
  <h1 id="qunit-header">
    <a href="http://jqvmap.com/">JQVMap</a> Legacy Test Suite
  </h1>

  <div></div>
  <h2 id="qunit-banner"></h2>

  <div id="qunit-testrunner-toolbar"></div>
  <h2 id="qunit-userAgent"></h2>
  <ol id="qunit-tests"></ol>

  <!-- Test HTML -->
  <div id="test-map"></div>

</body>

</html>
